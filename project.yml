name: SpoofDPI
options:
  bundleIdPrefix: com.spoofdpi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "2.0.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  SpoofDPIHelper:
    type: tool
    platform: macOS
    sources:
      - path: SpoofDPIHelper
    settings:
      base:
        PRODUCT_NAME: SpoofDPIHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.spoofdpi.menubar.helper
        SKIP_INSTALL: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SUPPORTED_PLATFORMS: macosx
        SUPPORTS_MACCATALYST: NO

  SpoofDPI:
    type: application
    platform: macOS
    sources:
      - path: SpoofDPIApp
        excludes:
          - Resources/**
          - Info.plist
          - Library/**
      - path: SpoofDPIApp/Resources/spoofdpi
        type: file
        buildPhase: resources
    dependencies:
      - framework: Vendor/Sparkle/Sparkle.xcframework
        embed: true
        codeSign: true
      - target: SpoofDPIHelper
        embed: false
        link: false
    settings:
      base:
        PRODUCT_NAME: SpoofDPI
        PRODUCT_BUNDLE_IDENTIFIER: com.spoofdpi.menubar
        INFOPLIST_FILE: SpoofDPIApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpoofDPIApp/SpoofDPI.entitlements
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTED_PLATFORMS: macosx
        SUPPORTS_MACCATALYST: NO
        SDKROOT: macosx
    postBuildScripts:
      - name: Embed Helper and LaunchDaemon
        basedOnDependencyAnalysis: false
        script: |
          set -e
          APP_BUNDLE="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          mkdir -p "${APP_BUNDLE}/Contents/MacOS"
          mkdir -p "${APP_BUNDLE}/Contents/Library/LaunchDaemons"
          cp "${BUILT_PRODUCTS_DIR}/SpoofDPIHelper" "${APP_BUNDLE}/Contents/MacOS/SpoofDPIHelper"
          chmod +x "${APP_BUNDLE}/Contents/MacOS/SpoofDPIHelper"
          cp "${SRCROOT}/SpoofDPIApp/Library/LaunchDaemons/com.spoofdpi.menubar.helper.plist" \
             "${APP_BUNDLE}/Contents/Library/LaunchDaemons/com.spoofdpi.menubar.helper.plist"

schemes:
  SpoofDPI:
    build:
      targets:
        SpoofDPIHelper: [build]
        SpoofDPI: all
    run:
      config: Debug
      executable: SpoofDPI
    archive:
      config: Release
  SpoofDPIHelper:
    build:
      targets:
        SpoofDPIHelper: all
    run:
      config: Debug
